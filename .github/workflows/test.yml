name: Run test

on:
    pull_request:

jobs:
    backend-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Run tests
              run: mvn clean test
              working-directory: my-workout-api

    frontend-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: my-workout-app/package-lock.json

            - name: Install dependencies
              run: npm ci
              working-directory: my-workout-app

            - name: Lint
              run: npm run lint
              working-directory: my-workout-app

            - name: Run tests
              run: npm run test
              working-directory: my-workout-app

            - name: Build
              run: npm run build
              working-directory: my-workout-app
