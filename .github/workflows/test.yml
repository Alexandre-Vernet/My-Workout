name: Run test

on:
    pull_request:
    # Also called by docker-build-deploy.yml, so nothing reaches production without passing
    workflow_call:

jobs:
    backend-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21
                  cache: maven

            - name: Run tests
              run: bash mvnw -B clean test
              working-directory: my-workout-api

    frontend-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: my-workout-app/package-lock.json

            - name: Install dependencies
              run: npm ci
              working-directory: my-workout-app

            - name: Lint
              run: npm run lint
              working-directory: my-workout-app

            - name: Run tests
              run: npm run test
              working-directory: my-workout-app

            - name: Build
              run: npm run build
              working-directory: my-workout-app
