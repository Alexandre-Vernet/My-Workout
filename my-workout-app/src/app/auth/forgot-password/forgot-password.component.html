@if (showDialogForgotPassword()) {
    <div class="overlay-backdrop" (click)="closeModal()">
        <div class="overlay-card" (click)="$event.stopPropagation()">
            <div class="overlay-header">
                <h2>{{ i18n.title }}</h2>
                <button type="button" class="overlay-close" [attr.aria-label]="i18n.close" (click)="closeModal()">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>

            <p class="dialog-subtitle">
                {{ i18n.subtitle }}
            </p>

            <div class="field">
                <input id="forgot-email" type="email" [formControl]="email" placeholder=" " autocomplete="off"/>
                <label for="forgot-email">{{ i18n.emailLabel }}</label>
            </div>
            @if (email.touched && email.hasError('email')) {
                <p class="field-error">{{ i18n.emailInvalid }}</p>
            }

            <div class="dialog-actions">
                <button type="button" class="btn btn-secondary" (click)="closeModal()">{{ i18n.cancel }}</button>
                <button
                    type="button"
                    class="btn btn-primary"
                    [class.loading]="isLoading()"
                    [disabled]="email.invalid || !email.value"
                    (click)="forgotPassword()">
                    {{ i18n.confirm }}
                </button>
            </div>
        </div>
    </div>
}
