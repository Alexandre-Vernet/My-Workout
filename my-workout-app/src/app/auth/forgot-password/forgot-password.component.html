@if (showDialogForgotPassword()) {
    <div class="overlay-backdrop" (click)="closeModal()">
        <div class="overlay-card" (click)="$event.stopPropagation()">
            <div class="overlay-header">
                <h2>Mot de passe oublié</h2>
                <button type="button" class="overlay-close" aria-label="Fermer" (click)="closeModal()">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>

            <p class="dialog-subtitle">
                Entrez votre email pour recevoir un mail de réinitialisation de mot de passe
            </p>

            <div class="field">
                <input id="forgot-email" type="email" [formControl]="email" placeholder=" " autocomplete="off"/>
                <label for="forgot-email">Email</label>
            </div>
            @if (email.touched && email.hasError('email')) {
                <p class="field-error">L'email n'est pas valide</p>
            }

            <div class="dialog-actions">
                <button type="button" class="btn btn-secondary" (click)="closeModal()">Annuler</button>
                <button
                    type="button"
                    class="btn btn-primary"
                    [class.loading]="isLoading()"
                    [disabled]="email.invalid || !email.value"
                    (click)="forgotPassword()">
                    Confirmer
                </button>
            </div>
        </div>
    </div>
}
