<div class="auth-page">
    <div class="auth-blobs" aria-hidden="true">
        <span class="auth-blob auth-blob-1"></span>
        <span class="auth-blob auth-blob-2"></span>
        <span class="auth-blob auth-blob-3"></span>
    </div>

    <div class="auth-card">
        <div class="auth-brand">
            <span class="auth-brand-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M6.5 6.5l11 11M4 9l3-3 3 3M20 15l-3 3-3-3M2.5 11.5l3 3M21.5 9.5l-3-3"/>
                </svg>
            </span>
            <h1>{{ i18n.title }}</h1>
        </div>

        <form [formGroup]="formLogin" (ngSubmit)="signIn()" class="auth-form">
            <div>
                <div class="field">
                    <input id="login-email" formControlName="email" type="email" placeholder=" " autocomplete="email">
                    <label for="login-email">{{ i18n.emailPlaceholder }}</label>
                </div>
                @if (formLogin.controls.email.touched && formLogin.controls.email.hasError('email')) {
                    <p class="field-error">{{ i18n.emailInvalid }}</p>
                }
                @if (formLogin.hasError('badCredential')) {
                    <p class="field-error">{{ i18n.badCredential }}</p>
                }
            </div>

            <div class="field">
                <input id="login-password" formControlName="password" type="password" placeholder=" " autocomplete="current-password">
                <label for="login-password">{{ i18n.passwordPlaceholder }}</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block auth-submit" [disabled]="formLogin.invalid">
                <span>{{ i18n.submit }}</span>
                <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </form>

        <div class="auth-links">
            <button type="button" class="link-button" (click)="showDialogForgotPassword = true">{{ i18n.forgotPassword }}</button>
            <a routerLink="/auth/register" class="link-button-accent">{{ i18n.registerLink }}</a>
        </div>
    </div>
</div>

<app-forgot-password [(showDialogForgotPassword)]="showDialogForgotPassword"></app-forgot-password>
