<div class="section">
    <h2 class="section-title">
        <span class="section-icon">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 3a6 6 0 0 0 0 18 3.5 3.5 0 0 1-3.5-3.5c0-1 .5-1.5 1-2s1-1 1-1.5a2 2 0 0 0-2-2H7"/>
            </svg>
        </span>
        {{ i18n.title }}
    </h2>

    <div class="swatches">
        @for (color of presetsArray; track color.key) {
            <button
                type="button"
                class="swatch"
                [class.selected]="color.key === selectedTheme"
                [style.background-color]="color.value.color"
                [style.color]="color.value.color"
                (click)="updatePreset(color.key)"
                [title]="color.key"
                [attr.aria-label]="color.key">
            </button>
        }
    </div>

    <div class="toggle-row">
        <label for="dark-mode">{{ i18n.darkMode }}</label>
        <app-toggle-switch
            inputId="dark-mode"
            [checked]="isCheckedDarkMode"
            (checkedChange)="toggleDarkMode($event)"/>
    </div>
</div>
