<div class="profile">
    @if (user()) {
        <header class="profile-hero">
            <span class="profile-avatar">{{ initial() }}</span>
            <div class="profile-identity">
                <strong>{{ user()!.email }}</strong>
                @if (user()!.admin) {
                    <span class="profile-badge">Admin</span>
                }
            </div>
        </header>
    } @else {
        <div class="profile-hero skeleton">
            <span class="profile-avatar skeleton-fill"></span>
            <div class="profile-identity">
                <span class="skeleton-fill skeleton-line"></span>
            </div>
        </div>
    }

    @if (user()?.admin) {
        <a routerLink="/admin/add-exercise" class="profile-card profile-admin-link">
            <span class="profile-section-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="5" y="11" width="14" height="10" rx="2"/>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
            </span>
            <span class="profile-admin-label">Administration</span>
            <svg class="profile-chevron" viewBox="0 0 24 24">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </a>
    }

    <section class="profile-card">
        <app-manage-account (showAlert)="displayAlert($event)"/>
    </section>

    <section class="profile-card">
        <app-change-theme/>
    </section>

    <section class="profile-card">
        <app-account-actions (showAlert)="displayAlert($event)"/>
    </section>
</div>
