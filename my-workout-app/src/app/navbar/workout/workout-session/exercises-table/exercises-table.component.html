<div class="exercises-table" [style.visibility]="exercisesMade().length > 0 ? 'visible' : 'hidden'">
    <div class="history-head">
        <span>Poids</span>
        <span>Reps</span>
        <span>Unilat.</span>
        <span>Repos</span>
        <span></span>
    </div>

    <div class="history-scroll" #historyScroll>
        @for (history of exercisesMade(); track history.id) {
            <div class="history-row">
                <app-number-stepper
                    [compact]="true"
                    suffix=" kg"
                    [min]="0"
                    [max]="500"
                    [step]="0.5"
                    [value]="history.weight ?? null"
                    (valueChange)="onWeightChange(history, $event)"
                    (blurred)="updateHistory(history)"/>

                <app-number-stepper
                    [compact]="true"
                    [min]="1"
                    [max]="99"
                    [step]="1"
                    [value]="history.reps ?? null"
                    (valueChange)="onRepsChange(history, $event)"
                    (blurred)="updateHistory(history)"/>

                <button
                    type="button"
                    class="history-check"
                    [class.checked]="history.unilateral"
                    (click)="toggleUnilateral(history)"
                    aria-label="Unilatéral">
                    <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                </button>

                <span class="history-rest">{{ history.restTime }}</span>

                <button type="button" class="history-delete" (click)="deleteHistory(history)" aria-label="Supprimer">
                    <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                </button>
            </div>
        }
    </div>
</div>
