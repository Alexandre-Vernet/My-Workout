@if (openModal()) {
    <div class="overlay-backdrop" (click)="onHideModal()">
        <div class="overlay-card" (click)="$event.stopPropagation()">
            <div class="overlay-header">
                <h2>{{ i18n.title }}</h2>
                <button type="button" class="overlay-close" [attr.aria-label]="i18n.closeLabel" (click)="onHideModal()">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>

            <div class="cardio-list">
                @for (cardioExercise of cardioExercises(); track cardioExercise.id) {
                    <button
                        type="button"
                        class="cardio-option"
                        [class.selected]="selectedExercise()?.id === cardioExercise.id"
                        (click)="showInputDuration(cardioExercise)">
                        {{ cardioExercise.name }}
                    </button>
                }
            </div>

            @if (selectedExercise()) {
                <div class="cardio-duration">
                    <app-number-stepper [(value)]="inputDuration" [min]="1" [max]="999" [step]="1" [suffix]="i18n.durationSuffix"/>
                    <button
                        type="button"
                        class="btn btn-primary btn-block"
                        [disabled]="!inputDuration"
                        (click)="createCardioWorkout()">
                        {{ i18n.validateLabel }}
                    </button>
                </div>
            }
        </div>
    </div>
}
