<div class="select-workout">
    <h1>Sélectionner une séance</h1>

    @if (!muscleGroupExerciseCount()) {
        <div class="muscle-group-list">
            @for (skeleton of [1, 2, 3, 4, 5, 6, 7]; track skeleton) {
                <span class="muscle-group-card skeleton-fill"></span>
            }
        </div>
    } @else {
        <div class="muscle-group-list">
            @for (entry of muscleGroupExerciseCount()!; track entry.muscleGroup.id; let first = $first) {
                <button
                    type="button"
                    class="muscle-group-card"
                    [class.recommended]="first"
                    [style.--accent]="getMuscleGroupColor(entry.muscleGroup.name)"
                    (click)="clickMuscleGroup(entry.muscleGroup)">
                    <span class="muscle-group-dot"></span>
                    <span class="muscle-group-info">
                        <strong>{{ entry.muscleGroup.name | firstLetterUppercase }}</strong>
                        <span>{{ entry.exerciseCount }} exercice{{ entry.exerciseCount <= 1 ? '' : 's' }}</span>
                    </span>
                    @if (first) {
                        <span class="recommended-badge">Recommandé</span>
                    }
                    <svg class="muscle-group-chevron" viewBox="0 0 24 24">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </button>
            }
        </div>
    }
</div>

<app-dialog-select-cardio-exercise
    [cardioExercises]="cardioExercises()"
    [openModal]="isOpenModalExerciseCardio()"
    (openModalChange)="openModalCardioExerciseChange()"
    (showAlert)="showAlert($event)"/>

<app-confirm-dialog
    [open]="confirmNoExercisesOpen()"
    [title]="NO_EXERCISES_DIALOG.title"
    [message]="NO_EXERCISES_DIALOG.message"
    [confirmLabel]="NO_EXERCISES_DIALOG.confirmLabel"
    [cancelLabel]="NO_EXERCISES_DIALOG.cancelLabel"
    (confirmed)="confirmAddExercises()"
    (cancelled)="cancelAddExercises()"/>
