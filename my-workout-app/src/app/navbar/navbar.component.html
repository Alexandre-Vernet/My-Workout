<nav class="bottom-nav">
    <span class="nav-pill" [style.transform]="'translateX(' + (activeIndex() * 100) + '%)'"></span>

    @for (item of navItems; track item.route; let i = $index) {
        <a class="nav-item"
           [class.nav-item-main]="item.isMain"
           [class.active]="activeIndex() === i"
           [routerLink]="item.route">

            @if (item.isMain) {
                <span class="nav-main-circle">
                    <svg viewBox="0 0 24 24">
                        <path d="M6.5 6.5l11 11M4 9l3-3 3 3M20 15l-3 3-3-3M2.5 11.5l3 3M21.5 9.5l-3-3"/>
                    </svg>
                </span>
            } @else {
                @switch (item.icon) {
                    @case ('library') {
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="3" width="7" height="7" rx="2"/>
                            <rect x="14" y="3" width="7" height="7" rx="2"/>
                            <rect x="3" y="14" width="7" height="7" rx="2"/>
                            <rect x="14" y="14" width="7" height="7" rx="2"/>
                        </svg>
                    }
                    @case ('calendar') {
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="16" rx="2"/>
                            <path d="M3 9h18M8 3v4M16 3v4"/>
                        </svg>
                    }
                    @case ('stats') {
                        <svg viewBox="0 0 24 24">
                            <path d="M4 20V10M12 20V4M20 20v-7"/>
                        </svg>
                    }
                    @case ('profile') {
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/>
                        </svg>
                    }
                }
            }

            <small>{{ item.label }}</small>
        </a>
    }
</nav>
